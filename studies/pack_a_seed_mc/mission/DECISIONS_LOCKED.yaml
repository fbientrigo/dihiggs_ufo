version: 1
decisions:
  - id: D1
    date: "2026-07-22"
    decision: >
      Seed list is 30 predeclared seeds (config/seeds_v1.txt), generated by
      random.Random(20260722).randint(10000, 99999), skipping duplicates and
      the two canonical seeds, in draw order. Committed before any
      non-canonical seed was executed. Never reordered or replaced.
    authority: mission specification section 8

  - id: D2
    date: "2026-07-22"
    decision: >
      Frozen operator interface bin/pack-a only accepts seeds 12345/67890.
      Resolved by extending each worker's local point-config + seed
      whitelist (physics untouched, only the seed integer varies), per
      explicit user approval via AskUserQuestion.
    authority: user decision, 2026-07-22, option "Extend seed configs, same interface"
    see_also: BLOCKERS.md, config/ensemble_contract_v1.yaml

  - id: D3
    date: "2026-07-22"
    decision: >
      Real MadGraph5_aMC@NLO 3.5.3 is installed and used for every seed;
      no synthetic/mocked cross sections were generated at any point.
    authority: empirical verification (bin/pack-a preflight and run against
      ~/.local/mg5amcnlo/3.5.3), cross-checked against
      PACK_A_REPRODUCIBILITY_MATRIX.json canonical values.

  - id: D4
    date: "2026-07-22"
    decision: >
      This mission does not modify the frozen Pack A ZIP, does not touch
      Pack AA/Pack B files, does not execute any recast, and does not treat
      the resulting statistics as a theory systematic.
    authority: mission specification, sections 1, 2, 12
