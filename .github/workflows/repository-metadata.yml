name: Repository Metadata Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run repository metadata validation
        run: |
          python3 scripts/validate_repository_metadata.py

      - name: Verify JSON registry validity
        run: |
          python3 -m json.tool ARTIFACT_REGISTRY.json > /dev/null

      - name: Run lightweight pytest suite
        run: |
          pytest studies/pack_a_seed_mc/tests/ pack_b/tests/
